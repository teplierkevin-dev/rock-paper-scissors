    <script>
   
        //GET computer choice
        function getComputerChoice () {

        let random = 0;

        function getRandomInt() { //GET a random number between 0 and 30

            return random = (Math.floor(Math.random() * 30)); 
        }
       
        getRandomInt();  
         
        //IF number between 0 and 10 choose Rock
        //IF number between 11 and 20 choose Paper
        //IF number between 21 and 30 choose Scissor

        if (random >= 0 && random <=10) {
            return "Rock"
        } else if (random >= 11 && random <= 20) {
            return "Paper"
        } else {
            return "Scissor"
        };}
       

        //GET user Human choice
        //

        let userChoice = prompt(What are your choice? Rock? Paper? or Scissor?);

        if (userChoice == "Rock"){
            return "Rock"
        } else if (userChoice == "Paper") {
            return "Paper"
        } else if (userChoice == "Scissor"){
            return "Scissor"
        }
        

        //console.log(getComputerChoice());


    </script>
